<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Watch Terminal</title>
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
        }
        #stage {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #081226 0%, #000000 85%);
            touch-action: none; /* Prevents scroll, pinch, and pull gestures */
        }
        canvas { width: 100%; height: 100%; display: block; position: absolute; inset: 0; z-index: 1; touch-action: none; }
        
        #hud-container {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 14px 10px; pointer-events: none;
        }

        #top-row {
            display: flex; gap: 6px; align-items: center; justify-content: center;
            pointer-events: auto;
        }

        #link-btn {
            font-size: 8px; font-weight: 800; letter-spacing: 1px;
            color: #00F2FE; background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.4); border-radius: 12px;
            padding: 3px 8px; cursor: pointer; text-transform: uppercase;
        }
        #link-btn:active { background: #00F2FE; color: #000; }

        #status-pill {
            font-size: 8px; font-weight: 800; letter-spacing: 0.8px;
            color: #EF4444; background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px;
            padding: 3px 8px; text-transform: uppercase;
        }

        #transcript-box {
            font-size: 11px; font-weight: 700; text-align: center;
            color: #FFFFFF; text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            max-width: 92%; min-height: 42px; line-height: 1.35;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; word-break: break-word;
        }

        #instruction-pill {
            font-size: 8px; font-weight: 800; letter-spacing: 1px;
            color: #38BDF8; text-transform: uppercase;
            background: rgba(0, 0, 0, 0.5); padding: 3px 10px; border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* ── CONNECTION MODAL ──────────────────────────────────────────────── */
        #link-panel {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.95);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            padding: 16px; z-index: 100; pointer-events: auto;
        }
        #link-panel.show { display: flex; }
        #link-panel h3 { color: #00F2FE; font-size: 11px; margin-bottom: 6px; }
        
        #current-conn-status {
            font-size: 8px; font-weight: bold; color: #94A3B8;
            margin-bottom: 8px; text-transform: uppercase;
        }

        #link-panel input {
            width: 88%; padding: 7px 8px; font-size: 11px;
            background: #0f172a; border: 1.5px solid #00F2FE;
            color: #FFFFFF; border-radius: 8px; text-align: center;
            outline: none; margin-bottom: 8px;
        }

        .btn-grid { display: flex; gap: 6px; width: 88%; margin-bottom: 6px; }
        .btn {
            flex: 1; padding: 7px; border: none; border-radius: 8px;
            font-size: 9px; font-weight: bold; cursor: pointer;
        }
        .btn-connect { background: #10B981; color: #FFFFFF; }
        .btn-disconnect { background: #EF4444; color: #FFFFFF; }
        .btn-close { width: 88%; background: #334155; color: #F8FAFC; }
    </style>
</head>
<body>

<div id="stage">
    <canvas id="orb"></canvas>
    
    <div id="hud-container">
        <div id="top-row">
            <button id="link-btn" onclick="openLinkPanel(event)">⚡ LINK PC</button>
            <div id="status-pill">● OFFLINE</div>
        </div>
        
        <div id="transcript-box">HOLD ORB TO TALK</div>
        
        <div id="instruction-pill">HOLD & SPEAK</div>
    </div>

    <!-- Connection Panel -->
    <div id="link-panel">
        <h3>🔗 NEXUS AI LINK</h3>
        <div id="current-conn-status">STATUS: DISCONNECTED</div>
        
        <input type="text" id="pc-ip" placeholder="IP:PORT (e.g. 192.168.1.15:8000)">
        
        <div class="btn-grid">
            <button class="btn btn-connect" onclick="saveAndConnect()">CONNECT</button>
            <button class="btn btn-disconnect" onclick="disconnectPC()">DISCONNECT</button>
        </div>
        
        <button class="btn btn-close" onclick="closeLinkPanel()">✕ CLOSE</button>
    </div>
</div>

<script>
    // Disable right-click context menu everywhere
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    const canvas = document.getElementById('orb');
    const ctx = canvas.getContext('2d');
    const statusPill = document.getElementById('status-pill');
    const instructionPill = document.getElementById('instruction-pill');
    const transcriptBox = document.getElementById('transcript-box');
    const linkPanel = document.getElementById('link-panel');
    const ipInput = document.getElementById('pc-ip');
    const currentConnStatus = document.getElementById('current-conn-status');

    let ws = null;
    let state = "STANDBY"; // STANDBY | RECORDING | SENDING | SUCCESS
    let rot = 0;
    let pulseScale = 1.0;
    let shockwaves = [];
    let particles = [];
    let isHolding = false;

    // ── 1. HARDWARE AUDIO & HAPTIC SYNTHESIZER ───────────────────────────────
    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playBeep(freq, type, duration) {
        try {
            const ac = getAudioCtx();
            const now = ac.currentTime;
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            g.gain.setValueAtTime(0.28, now);
            g.gain.exponentialRampToValueAtTime(0.01, now + duration);
            osc.connect(g); g.connect(ac.destination);
            osc.start(now); osc.stop(now + duration);
        } catch(e) {}
    }

    function vibrate(pattern) {
        if ("vibrate" in navigator) navigator.vibrate(pattern);
    }

    // ── 2. PARTICLES & CANVAS ENGINE ────────────────────────────────────────
    function initParticles() {
        particles = [];
        for (let i = 0; i < 24; i++) {
            particles.push({
                ang: Math.random() * Math.PI * 2,
                dist: Math.random() * 50 + 20,
                speed: (Math.random() * 0.02 + 0.01) * (Math.random() > 0.5 ? 1 : -1),
                size: Math.random() * 2.2 + 1.0,
                alpha: Math.random() * 0.7 + 0.3
            });
        }
    }
    initParticles();

    function triggerShockwave(color) {
        shockwaves.push({ r: 20, maxR: 130, alpha: 1.0, color: color });
    }

    function resize() {
        canvas.width = window.innerWidth || 320;
        canvas.height = window.innerHeight || 320;
    }
    window.addEventListener('resize', resize);
    resize();

    let wavePhase = 0;
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const baseR = Math.min(cx, cy) * 0.38;

        rot += (state === "RECORDING") ? 0.07 : 0.018;
        wavePhase += 0.15;

        // Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            const sw = shockwaves[i];
            sw.r += 5.0;
            sw.alpha *= 0.91;
            ctx.save();
            ctx.strokeStyle = sw.color.replace('1)', `${sw.alpha})`);
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(cx, cy, sw.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            if (sw.alpha < 0.05) shockwaves.splice(i, 1);
        }

        // Active State Colors
        let coreColor1 = "#38BDF8", coreColor2 = "#0F172A", rimColor = "rgba(0, 242, 254, 0.4)";
        if (state === "RECORDING") {
            coreColor1 = "#FFFFFF"; coreColor2 = "#EF4444"; rimColor = "#EF4444";
            pulseScale = 1.14 + Math.sin(wavePhase * 0.8) * 0.08;
        } else if (state === "SUCCESS") {
            coreColor1 = "#FFFFFF"; coreColor2 = "#10B981"; rimColor = "#10B981";
            pulseScale = 1.15;
        } else {
            pulseScale = 1.0 + Math.sin(wavePhase * 0.3) * 0.02;
        }

        const r = baseR * pulseScale;

        // Radial Aura
        const aura = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r * 1.8);
        aura.addColorStop(0, state === "RECORDING" ? "rgba(239, 68, 68, 0.55)" : (state === "SUCCESS" ? "rgba(16, 185, 129, 0.5)" : "rgba(56, 189, 248, 0.18)"));
        aura.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Particles
        for (let p of particles) {
            p.ang += p.speed;
            const px = cx + Math.cos(p.ang) * (r + p.dist);
            const py = cy + Math.sin(p.ang) * (r + p.dist);
            ctx.fillStyle = state === "RECORDING" ? `rgba(239, 68, 68, ${p.alpha})` : (state === "SUCCESS" ? `rgba(16, 185, 129, ${p.alpha})` : `rgba(0, 242, 254, ${p.alpha * 0.6})`);
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Concentric Rings
        for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rot * (i % 2 === 0 ? 1 : -1) + (i * Math.PI / 3));
            ctx.strokeStyle = rimColor;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(0, 0, r + (i * 7), 0, Math.PI * 1.3);
            ctx.stroke();
            ctx.restore();
        }

        // Reactor Core
        const coreGrad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, 0, cx, cy, r);
        coreGrad.addColorStop(0, coreColor1);
        coreGrad.addColorStop(0.6, coreColor2);
        coreGrad.addColorStop(1, "#020617");
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.74, 0, Math.PI * 2);
        ctx.fill();

        // Equalizer Bars while holding
        if (state === "RECORDING") {
            const barCount = 5;
            const barW = 3.5;
            const spacing = 7;
            const totalW = barCount * spacing;
            for (let i = 0; i < barCount; i++) {
                const barH = 8 + Math.abs(Math.sin(wavePhase + i * 0.8)) * 28;
                const bx = cx - totalW / 2 + i * spacing;
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(bx, cy - barH / 2, barW, barH);
            }
        }

        requestAnimationFrame(render);
    }
    render();

    // ── 3. WEBSOCKET CONTROLLER ─────────────────────────────────────────────
    function getSavedHost() {
        return localStorage.getItem("nexus_pc_host") || window.location.host;
    }

    function initSocket() {
        const host = getSavedHost();
        ipInput.value = host;
        const proto = (window.location.protocol === "https:") ? "wss://" : "ws://";
        
        if (ws) {
            try { ws.close(); } catch(e) {}
            ws = null;
        }

        try {
            ws = new WebSocket(`${proto}${host}/ws?token=watch`);

            ws.onopen = () => {
                statusPill.textContent = "● LINKED";
                statusPill.style.color = "#10B981";
                statusPill.style.borderColor = "#10B981";
                currentConnStatus.textContent = `LINKED: ${host}`;
                currentConnStatus.style.color = "#10B981";
                vibrate([40]);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "ai_response" && data.text) {
                        transcriptBox.textContent = `"${data.text}"`;
                        instructionPill.textContent = "JARVIS REPLIED";
                        triggerShockwave("rgba(0, 242, 254, 1)");
                        playBeep(880, "sine", 0.15);
                    }
                } catch(e) {}
            };

            ws.onclose = () => {
                statusPill.textContent = "● OFFLINE";
                statusPill.style.color = "#EF4444";
                statusPill.style.borderColor = "#EF4444";
                currentConnStatus.textContent = "STATUS: DISCONNECTED";
                currentConnStatus.style.color = "#EF4444";
                setTimeout(initSocket, 3000);
            };

            ws.onerror = () => {
                statusPill.textContent = "● NO LINK";
                statusPill.style.color = "#EF4444";
            };
        } catch (e) {
            statusPill.textContent = "● IP ERROR";
        }
    }

    function sendCommandToPC(fullText) {
        state = "SUCCESS";
        playBeep(1100, "triangle", 0.16);
        vibrate([50, 50, 80]);
        triggerShockwave("rgba(16, 185, 129, 1)");
        
        instructionPill.textContent = "SENT TO JARVIS";
        transcriptBox.textContent = `"${fullText.toUpperCase()}"`;

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: "command",
                text: fullText
            }));
        } else {
            transcriptBox.textContent = "⚠️ NOT CONNECTED TO PC";
        }

        setTimeout(() => {
            state = "STANDBY";
            instructionPill.textContent = "HOLD & SPEAK";
            transcriptBox.textContent = "HOLD ORB TO TALK";
        }, 3000);
    }

    function disconnectPC() {
        if (ws) { ws.close(); ws = null; }
        vibrate([80]);
        currentConnStatus.textContent = "STATUS: DISCONNECTED";
        currentConnStatus.style.color = "#EF4444";
        statusPill.textContent = "● DISCONNECTED";
        statusPill.style.color = "#EF4444";
    }

    function saveAndConnect() {
        let val = ipInput.value.trim();
        if (val) {
            val = val.replace(/^(http:\/\/|https:\/\/|ws:\/\/|wss:\/\/)/i, "").replace(/\/$/, "");
            localStorage.setItem("nexus_pc_host", val);
            initSocket();
            closeLinkPanel();
        }
    }

    function openLinkPanel(e) {
        if (e) e.stopPropagation();
        ipInput.value = getSavedHost();
        linkPanel.classList.add('show');
    }

    function closeLinkPanel() {
        linkPanel.classList.remove('show');
    }

    // ── 4. SPEECH ENGINE FOR PUSH-TO-TALK ────────────────────────────────────
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let accumulatedText = "";

    if (SpeechRec) {
        rec = new SpeechRec();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = navigator.language || "en-US";

        rec.onresult = (e) => {
            let sessionResult = "";
            for (let i = 0; i < e.results.length; ++i) {
                sessionResult += e.results[i][0].transcript + " ";
            }
            sessionResult = sessionResult.trim();
            if (sessionResult) {
                accumulatedText = sessionResult;
                transcriptBox.textContent = `"${accumulatedText}"`;
            }
        };

        rec.onerror = (e) => {
            console.log("Speech Error:", e.error);
        };

        rec.onend = () => {
            // If user is still physically holding the orb, keep listening!
            if (isHolding) {
                try { rec.start(); } catch(err) {}
            }
        };
    } else {
        transcriptBox.textContent = "BROWSER MIC NOT SUPPORTED";
    }

    // ── 5. TRUE PUSH-TO-TALK HOLD ENGINE ────────────────────────────────────
    function startHolding(e) {
        if (e) e.preventDefault();
        if (linkPanel.classList.contains('show')) return;
        if (isHolding) return;

        getAudioCtx();
        isHolding = true;
        accumulatedText = "";
        state = "RECORDING";

        playBeep(660, "sine", 0.1);
        vibrate([70]);
        triggerShockwave("rgba(239, 68, 68, 1)");

        instructionPill.textContent = "🎙️ RECORDING... RELEASE TO SEND";
        transcriptBox.textContent = "SPEAK NOW...";

        try {
            rec.start();
        } catch(err) {}
    }

    function releaseHolding(e) {
        if (e) e.preventDefault();
        if (!isHolding) return;
        isHolding = false;

        state = "SENDING";
        instructionPill.textContent = "PROCESSING...";

        // Small 220ms buffer to finalize trailing words before cutting the mic
        setTimeout(() => {
            try { rec.stop(); } catch(err) {}

            const finalText = accumulatedText.trim();
            if (finalText.length > 0) {
                sendCommandToPC(finalText);
            } else {
                state = "STANDBY";
                instructionPill.textContent = "HOLD & SPEAK";
                transcriptBox.textContent = "HOLD ORB TO TALK";
            }
        }, 220);
    }

    // Bind physical Touch & Mouse HOLD events
    const stage = document.getElementById('stage');

    // 1. Touch Events (Watch Screens)
    stage.addEventListener('touchstart', (e) => {
        if (e.target.id === 'link-btn' || linkPanel.classList.contains('show')) return;
        startHolding(e);
    }, { passive: false });

    stage.addEventListener('touchend', (e) => {
        if (e.target.id === 'link-btn' || linkPanel.classList.contains('show')) return;
        releaseHolding(e);
    }, { passive: false });

    stage.addEventListener('touchcancel', (e) => {
        releaseHolding(e);
    }, { passive: false });

    // 2. Mouse Events (Desktop Testing)
    stage.addEventListener('mousedown', (e) => {
        if (e.target.id === 'link-btn' || linkPanel.classList.contains('show')) return;
        startHolding(e);
    });

    stage.addEventListener('mouseup', (e) => {
        if (e.target.id === 'link-btn' || linkPanel.classList.contains('show')) return;
        releaseHolding(e);
    });

    stage.addEventListener('mouseleave', (e) => {
        if (isHolding) releaseHolding(e);
    });

    initSocket();
</script>
</body>
</html>
