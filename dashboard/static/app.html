<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS Mobile Terminal</title>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    :root {
      --bg: #030712;
      --panel: rgba(13, 19, 33, 0.78);
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 242, 254, 0.35);
      --cyan: #00F2FE;
      --purple: #A855F7;
      --green: #10B981;
      --red: #EF4444;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --dim: #64748B;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
    }

    /* ── 1. HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(3, 7, 18, 0.90);
      backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
      z-index: 30;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #FFF;
    }
    .brand-icon {
      width: 24px; height: 24px; border-radius: 6px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.22);
      color: #FFF; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900;
    }
    .status-wrap { display: flex; align-items: center; gap: 8px; }
    .status-pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 20px; font-size: 9px; font-weight: 800; letter-spacing: 1px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border);
      color: var(--muted); text-transform: uppercase; transition: all 0.3s;
    }
    .status-pill.active {
      color: var(--green); border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.12);
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-pill.active .status-dot { box-shadow: 0 0 8px var(--green); animation: pulseDot 2s infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .sec-badge {
      font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px;
      background: rgba(0, 242, 254, 0.08); border: 1px solid rgba(0, 242, 254, 0.25);
      color: var(--cyan); letter-spacing: 1px;
    }

    /* ── 2. STAGE & CANVAS ── */
    #stage-area {
      position: relative; flex: 1; width: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; padding: 16px 14px 12px; overflow: hidden;
    }
    canvas#core-orb {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 1; touch-action: none; cursor: pointer;
    }

    /* ── 3. DUAL HUD PANELS (LATEST ONLY) ── */
    #hud-overlay {
      position: relative; z-index: 10; width: 100%; max-width: 440px;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }
    .hud-card {
      background: var(--panel); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; animation: slideIn 0.25s ease-out;
      pointer-events: auto;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hud-card.user {
      border-left: 3px solid var(--cyan);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .hud-card.ai {
      border-left: 3px solid var(--purple);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .hud-tag {
      font-size: 8px; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
    }
    .hud-card.user .hud-tag { color: var(--cyan); }
    .hud-card.ai .hud-tag { color: var(--purple); }
    .hud-text {
      font-size: 13px; font-weight: 600; line-height: 1.5;
      color: var(--text); word-break: break-word;
    }

    /* Status Instruction Badge */
    #center-tip {
      position: relative; z-index: 10; font-size: 9px; font-weight: 800;
      letter-spacing: 1px; color: var(--muted); text-transform: uppercase;
      background: rgba(10, 15, 29, 0.75); padding: 5px 14px; border-radius: 20px;
      border: 1px solid var(--border); pointer-events: none;
      transition: all 0.25s ease; backdrop-filter: blur(8px);
    }
    #center-tip.recording {
      color: #FFF; border-color: var(--red);
      background: rgba(239, 68, 68, 0.25);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
    }
    #center-tip.sending {
      color: var(--cyan); border-color: var(--cyan);
      background: rgba(0, 242, 254, 0.15);
    }

    /* ── 4. FOOTER CONTROLS ── */
    footer {
      flex-shrink: 0; padding: 10px 14px 14px;
      background: rgba(3, 7, 18, 0.94); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border); z-index: 30;
      display: flex; gap: 8px; align-items: center;
    }
    .input-box {
      flex: 1; display: flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
      border-radius: 12px; padding: 0 10px; height: 44px;
      transition: border-color 0.2s;
    }
    .input-box:focus-within { border-color: var(--cyan); }
    #txt-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 13px; font-weight: 500;
    }
    #txt-input::placeholder { color: var(--dim); }
    
    .btn-icon {
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-size: 16px; padding: 4px; display: flex;
      align-items: center; justify-content: center; transition: color 0.15s;
    }
    .btn-icon:hover { color: var(--cyan); }

    /* Dual Tap/Hold Mic Button */
    #mic-btn {
      width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--border);
      background: rgba(255, 255, 255, 0.05); color: var(--text);
      font-size: 17px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; transition: all 0.2s ease;
      touch-action: none;
    }
    #mic-btn.active {
      background: rgba(239, 68, 68, 0.24);
      border-color: var(--red); color: var(--red);
      transform: scale(0.95); box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
    }

    #send-btn {
      height: 44px; padding: 0 15px; border-radius: 12px; border: none;
      background: var(--cyan); color: #030712; font-size: 13px; font-weight: 800;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    #send-btn:active { transform: scale(0.96); }

    /* Toast */
    #toast {
      position: fixed; top: 62px; left: 50%; transform: translateX(-50%) translateY(-10px);
      background: rgba(16, 185, 129, 0.2); border: 1px solid var(--green);
      color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: 1px;
      padding: 6px 16px; border-radius: 20px; opacity: 0; transition: all 0.25s ease;
      pointer-events: none; z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="toast">CONNECTED</div>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">N</div>
      <span>NEXUS</span>
    </div>
    <div class="status-wrap">
      <div class="status-pill" id="conn-pill">
        <div class="status-dot"></div>
        <span id="conn-text">Connecting</span>
      </div>
      <div class="sec-badge" id="enc-badge">AES-256</div>
    </div>
  </header>

  <!-- Interactive Stage & Metallic Arc Core Canvas -->
  <div id="stage-area">
    <canvas id="core-orb"></canvas>

    <!-- Latest Exchanges HUD Overlay -->
    <div id="hud-overlay">
      <div class="hud-card user" id="user-card" style="display: none;">
        <div class="hud-tag"><span>●</span> YOU</div>
        <div class="hud-text" id="user-text">...</div>
      </div>
      <div class="hud-card ai" id="ai-card">
        <div class="hud-tag"><span>●</span> NEXUS AI</div>
        <div class="hud-text" id="ai-text">Nexus Terminal connected. Hold mic or orb to speak.</div>
      </div>
    </div>

    <!-- Center Context Tip -->
    <div id="center-tip">HOLD OR TAP MIC TO SPEAK</div>
  </div>

  <!-- Bottom Command Bar -->
  <footer>
    <div class="input-box">
      <input type="text" id="txt-input" placeholder="Type command to Nexus..." autocomplete="off">
      <label class="btn-icon" for="file-upload" title="Send File">📎</label>
      <input type="file" id="file-upload" multiple style="display: none;">
    </div>
    <button id="mic-btn" title="Hold or Tap to speak">🎙</button>
    <button id="send-btn" onclick="sendTypedCommand()">SEND</button>
  </footer>

  <script>
    // ── 1. AUTHENTICATION & ENCRYPTION ──────────────────────────────────────
    const _token = sessionStorage.getItem('jarvis_token');
    const _key   = sessionStorage.getItem('jarvis_key');
    if (!_token) location.replace('/login');

    const _SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;
    if (_key && typeof CryptoJS !== 'undefined') {
      _aesKey = CryptoJS.SHA256(_key + _SALT);
    }

    function encryptPayload(txt) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse(txt), _aesKey, {
          iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7
        });
        const hex = iv.toString(CryptoJS.enc.Hex) + enc.ciphertext.toString(CryptoJS.enc.Hex);
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch(e) { return null; }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ── 2. WEBSOCKET ENGINE ─────────────────────────────────────────────────
    const connPill = document.getElementById('conn-pill');
    const connText = document.getElementById('conn-text');
    const userCard = document.getElementById('user-card');
    const userText = document.getElementById('user-text');
    const aiCard   = document.getElementById('ai-card');
    const aiText   = document.getElementById('ai-text');
    const centerTip= document.getElementById('center-tip');

    const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${wsProto}://${location.host}/ws?token=${encodeURIComponent(_token)}`);

    ws.onopen = () => {
      connPill.classList.add('active');
      connText.textContent = "ONLINE";
      showToast("CONNECTED TO NEXUS");
    };

    ws.onclose = () => {
      connPill.classList.remove('active');
      connText.textContent = "OFFLINE";
    };

    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'ai_response' || (data.type === 'log' && data.speaker === 'jarvis')) {
          setAiResponse(data.text);
        } else if (data.type === 'status') {
          if (data.state === 'active') connPill.classList.add('active');
          else connPill.classList.remove('active');
        }
      } catch(err) {}
    };

    function setAiResponse(txt) {
      aiCard.style.display = 'block';
      aiText.textContent = txt;
      triggerShockwave("rgba(168, 85, 247, 1)");
      playChime(880, 0.12);
      vibrate([40]);
      setOrbState("STANDBY");

      // Phone speaks the confirmation out loud through its speaker
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(txt);
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    function setUserCommand(txt) {
      userCard.style.display = 'block';
      userText.textContent = txt;
    }

    function sendLiveCommand(text) {
      if (!text) return;
      setUserCommand(text);
      setOrbState("SENDING");

      const enc = encryptPayload(text);
      const payload = enc ? { enc } : { text };

      // Send EXCLUSIVELY via WebSocket if open to avoid turn collision
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "command", ...payload }));
      } else {
        fetch('/api/command', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${_token}`
          },
          body: JSON.stringify(payload)
        }).catch(() => {});
      }

      triggerShockwave("rgba(0, 242, 254, 1)");
    }

    function sendTypedCommand() {
      const inp = document.getElementById('txt-input');
      const val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      sendLiveCommand(val);
    }

    document.getElementById('txt-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendTypedCommand();
    });

    // ── 3. HARDWARE AUDIO & HAPTICS ─────────────────────────────────────────
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playChime(freq, dur) {
      try {
        const ac = getAudioCtx();
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.frequency.setValueAtTime(freq, ac.currentTime);
        g.gain.setValueAtTime(0.2, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + dur);
        osc.connect(g); g.connect(ac.destination);
        osc.start(); osc.stop(ac.currentTime + dur);
      } catch(e) {}
    }

    function vibrate(p) {
      if ("vibrate" in navigator) navigator.vibrate(p);
    }

    // ── 4. 3D METALLIC ARC REACTOR CANVAS ENGINE ────────────────────────────
    const canvas = document.getElementById('core-orb');
    const ctx = canvas.getContext('2d');
    let orbState = "STANDBY"; // STANDBY | RECORDING | SENDING
    let rot1 = 0, rot2 = 180, wavePhase = 0;
    let shockwaves = [];
    let particles = [];

    // Ambient Stardust Motes
    function initParticles() {
      particles = [];
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random(),
          y: Math.random(),
          speed: Math.random() * 0.0008 + 0.0003,
          size: Math.random() * 1.8 + 0.8,
          alpha: Math.random() * 0.6 + 0.2
        });
      }
    }
    initParticles();

    function triggerShockwave(color) {
      shockwaves.push({ r: 30, maxR: 180, alpha: 1.0, color });
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderEngine() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const W = canvas.width;
      const H = canvas.height;
      const cx = W / 2;
      const cy = H / 2;
      const baseR = Math.min(cx, cy) * 0.36;

      const speed = (orbState === "RECORDING") ? 0.06 : (orbState === "SENDING" ? 0.08 : 0.018);
      rot1 = (rot1 + speed) % (Math.PI * 2);
      rot2 = (rot2 - speed * 1.3) % (Math.PI * 2);
      wavePhase += 0.14;

      // 1. Drifting Ambient Stardust Motes
      for (let p of particles) {
        p.y -= p.speed;
        if (p.y < 0) { p.y = 1; p.x = Math.random(); }
        ctx.fillStyle = `rgba(148, 163, 184, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x * W, p.y * H, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Shockwaves
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += 6.5;
        sw.alpha *= 0.91;
        ctx.save();
        ctx.strokeStyle = sw.color.replace('1)', `${sw.alpha})`);
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        if (sw.alpha < 0.05) shockwaves.splice(i, 1);
      }

      // 3. Pulse Scaling
      let pulseScale = 1.0;
      if (orbState === "RECORDING") pulseScale = 1.08 + Math.sin(wavePhase * 0.8) * 0.05;
      else if (orbState === "SENDING") pulseScale = 1.05 + Math.sin(wavePhase * 1.4) * 0.04;
      else pulseScale = 1.0 + Math.sin(wavePhase * 0.3) * 0.018;

      const r = baseR * pulseScale;

      // 4. Subtle Radial Under-Glow (Graphite / Deep Charcoal, No flat blue)
      const aura = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.7);
      if (orbState === "RECORDING") {
        aura.addColorStop(0, "rgba(239, 68, 68, 0.40)");
      } else if (orbState === "SENDING") {
        aura.addColorStop(0, "rgba(168, 85, 247, 0.30)");
      } else {
        aura.addColorStop(0, "rgba(15, 23, 42, 0.70)");
      }
      aura.addColorStop(1, "rgba(3, 7, 18, 0)");
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.7, 0, Math.PI * 2);
      ctx.fill();

      // 5. Concentric 3D Metallic Titanium Discs (Matching desktop UI CoreOrbCanvas)
      const rStages = [r * 1.65, r * 1.35, r * 1.10];
      const discShades = [
        ["#182232", "#0d121c", "rgba(255, 255, 255, 0.06)"],
        ["#1f2a3e", "#111724", "rgba(255, 255, 255, 0.10)"],
        ["#243148", "#141c2c", orbState === "RECORDING" ? "#EF4444" : "rgba(0, 242, 254, 0.4)"]
      ];

      for (let s = 0; s < 3; s++) {
        const rad = rStages[s];
        const grad = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
        grad.addColorStop(0, discShades[s][0]);
        grad.addColorStop(1, discShades[s][1]);
        ctx.fillStyle = grad;
        ctx.strokeStyle = discShades[s][2];
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // 6. Segmented Precision Gyro Arcs
      const arcCols = (orbState === "RECORDING")
        ? ["#EF4444", "#EF4444", "#EF4444", "#EF4444"]
        : ["#00F2FE", "#A855F7", "#10B981", "#FBBC05"];

      // Outer Arc Ring
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot1);
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = arcCols[i];
        ctx.lineWidth = 2.4;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.48, i * (Math.PI / 2), i * (Math.PI / 2) + 0.9);
        ctx.stroke();
      }
      ctx.restore();

      // Inner Arc Ring
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot2);
      for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = arcCols[(i + 1) % 4];
        ctx.lineWidth = 2.0;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.22, i * (Math.PI / 2), i * (Math.PI / 2) + 0.7);
        ctx.stroke();
      }
      ctx.restore();

      // 7. Center Obsidian / Carbon Dome Sphere
      const domeR = r * 0.85;
      const domeGrad = ctx.createRadialGradient(cx - domeR * 0.35, cy - domeR * 0.35, 0, cx, cy, domeR);
      if (orbState === "RECORDING") {
        domeGrad.addColorStop(0, "#FFFFFF");
        domeGrad.addColorStop(0.3, "#EF4444");
        domeGrad.addColorStop(1, "#381010");
      } else {
        domeGrad.addColorStop(0, "#334155");
        domeGrad.addColorStop(0.4, "#1e293b");
        domeGrad.addColorStop(1, "#030712");
      }
      ctx.fillStyle = domeGrad;
      ctx.strokeStyle = (orbState === "RECORDING") ? "#EF4444" : "rgba(0, 242, 254, 0.65)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, domeR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 8. Embossed AI Logo or Equalizer Bars
      if (orbState === "RECORDING") {
        const bars = 5;
        const bw = 3.5;
        const sp = 7.5;
        const totalW = bars * sp;
        for (let i = 0; i < bars; i++) {
          const bh = 8 + Math.abs(Math.sin(wavePhase + i * 0.8)) * 28;
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(cx - totalW / 2 + i * sp, cy - bh / 2, bw, bh);
        }
      } else {
        ctx.font = `bold ${Math.round(domeR * 0.55)}px "Segoe UI", sans-serif`;
        ctx.fillStyle = "#F8FAFC";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("N", cx, cy);
      }

      requestAnimationFrame(renderEngine);
    }
    renderEngine();

    function setOrbState(state) {
      orbState = state;
      centerTip.className = '';
      if (state === "RECORDING") {
        centerTip.textContent = "LISTENING... (TAP OR RELEASE TO SEND)";
        centerTip.classList.add('recording');
        micBtn.classList.add('active');
      } else if (state === "SENDING") {
        centerTip.textContent = "TRANSMITTING TO NEXUS...";
        centerTip.classList.add('sending');
        micBtn.classList.remove('active');
      } else {
        centerTip.textContent = "HOLD OR TAP MIC TO SPEAK";
        micBtn.classList.remove('active');
      }
    }

    // ── 5. BULLETPROOF SPEECH ENGINE (DUAL TAP & HOLD) ─────────────────────
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let isRecording = false;
    let lastTranscript = "";
    let holdTimeout = null;

    if (SpeechRec) {
      rec = new SpeechRec();
      rec.continuous = false; // continuous = false delivers fast, final transcripts on Android Chrome
      rec.interimResults = true;
      rec.lang = navigator.language || "en-US";

      rec.onresult = (e) => {
        let text = "";
        for (let i = 0; i < e.results.length; ++i) {
          text += e.results[i][0].transcript + " ";
        }
        lastTranscript = text.trim();
        if (lastTranscript) {
          setUserCommand(lastTranscript);
        }
      };

      rec.onerror = (e) => {
        console.log("Speech Error:", e.error);
        if (e.error === 'not-allowed') {
          showToast("MIC PERMISSION DENIED");
        }
      };

      rec.onend = () => {
        // If recording was active and user didn't manually stop yet, auto-finalize
        if (isRecording) {
          stopVoiceSession();
        }
      };
    }

    function startVoiceSession() {
      if (isRecording) return;
      getAudioCtx();
      isRecording = true;
      lastTranscript = "";
      setOrbState("RECORDING");
      vibrate([40]);
      playChime(640, 0.08);

      if (rec) {
        try { rec.start(); } catch(err) {}
      } else {
        showToast("BROWSER SPEECH NOT SUPPORTED");
      }
    }

    function stopVoiceSession() {
      if (!isRecording) return;
      isRecording = false;
      vibrate([30, 30]);

      if (rec) {
        try { rec.stop(); } catch(err) {}
      }

      // Small buffer to guarantee final words are latched before dispatch
      setTimeout(() => {
        const query = lastTranscript.trim();
        if (query.length > 0) {
          sendLiveCommand(query);
        } else {
          setOrbState("STANDBY");
        }
      }, 200);
    }

    const micBtn = document.getElementById('mic-btn');

    // Modern Pointer Events — Eliminates touch/mouse duplicate clicks and cancellations
    micBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      holdTimeout = setTimeout(() => {
        holdTimeout = null; // Recognized as Hold
      }, 250);
      startVoiceSession();
    });

    micBtn.addEventListener('pointerup', (e) => {
      e.preventDefault();
      if (holdTimeout) {
        clearTimeout(holdTimeout); // Was a quick tap! Toggle remains on until second tap
        holdTimeout = null;
      } else {
        stopVoiceSession(); // Was a hold release
      }
    });

    // Also tap or hold the center Canvas Reactor Core
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      startVoiceSession();
    });
    canvas.addEventListener('pointerup', (e) => {
      e.preventDefault();
      stopVoiceSession();
    });

    // ── 6. FILE ATTACHMENT ──────────────────────────────────────────────────
    document.getElementById('file-upload').addEventListener('change', function() {
      if (!this.files.length) return;
      const file = this.files[0];
      setUserCommand(`Uploading: ${file.name}`);

      const fd = new FormData();
      fd.append('file', file);

      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${_token}` },
        body: fd
      }).then(r => r.json()).then(res => {
        showToast("FILE UPLOADED");
        sendLiveCommand(`I have uploaded the file: ${res.name || file.name}`);
      }).catch(() => {
        showToast("UPLOAD ERROR");
      });
      this.value = '';
    });
  </script>

  <!-- Live Hardware GPS & Battery Beacon -->
  <script>
    (function() {
      let userBat = 100;
      if (navigator.getBattery) {
        navigator.getBattery().then(b => {
          userBat = Math.round(b.level * 100);
          b.addEventListener('levelchange', () => { userBat = Math.round(b.level * 100); });
        });
      }
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const payload = {
              type: "telemetry",
              device_name: navigator.userAgent.includes("iPhone") ? "Apple iPhone" : "Android Smartphone",
              lat: pos.coords.latitude,
              lon: pos.coords.longitude,
              speed: (pos.coords.speed || 0) * 3.6,
              heading: pos.coords.heading || 0,
              battery: userBat
            };
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify(payload));
            }
          },
          (err) => {},
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
        );
      }
    })();
  </script>
